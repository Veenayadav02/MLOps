name: Build and Deploy to Amazon EKS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  packages: write

env:
  IMAGE_NAME: house-price-ui
  AWS_REGION: us-east-1
  CLUSTER_NAME: mlops-coe
  NAMESPACE: streamlit
  DEPLOYMENT_NAME: house-price-ui

jobs:

  build:

    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Image Tag
        id: tag
        run: |
          echo "image_tag=${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

      - name: Convert Repository Owner to Lowercase
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -f house_price_mlflow/Dockerfile \
            -t ghcr.io/${OWNER}/${IMAGE_NAME}:${{ steps.tag.outputs.image_tag }} \
            -t ghcr.io/${OWNER}/${IMAGE_NAME}:latest \
            house_price_mlflow

      - name: Push Docker Image
        run: |
          docker push ghcr.io/${OWNER}/${IMAGE_NAME}:${{ steps.tag.outputs.image_tag }}
          docker push ghcr.io/${OWNER}/${IMAGE_NAME}:latest

  deploy:

    needs: build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Print GitHub Context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Repository Owner: $GITHUB_REPOSITORY_OWNER"
          echo "Ref: $GITHUB_REF"     
      - name: Print OIDC Claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();

            const payload = JSON.parse(
            Buffer.from(token.split('.')[1], 'base64').toString()
            );

            console.log(JSON.stringify(payload, null, 2));

      - name: Check OIDC Environment
        run: |
         echo "TOKEN URL: ${ACTIONS_ID_TOKEN_REQUEST_URL:+present}"
         echo "TOKEN TOKEN: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+present}"
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name $CLUSTER_NAME \
            --region $AWS_REGION

      - name: Convert Repository Owner to Lowercase
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Update Deployment Image
        run: |
          kubectl set image deployment/${DEPLOYMENT_NAME} \
          house-price-ui=ghcr.io/${OWNER}/${IMAGE_NAME}:${{ needs.build.outputs.image_tag }} \
          -n ${NAMESPACE}

      - name: Verify Rollout
        run: |
          kubectl rollout status deployment/${DEPLOYMENT_NAME} \
          -n ${NAMESPACE}

      - name: Verify Pods
        run: |
          kubectl get pods -n ${NAMESPACE}

      - name: Verify Service
        run: |
          kubectl get svc -n ${NAMESPACE}
          #3###
